[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-hospital-mcp"
version = "0.1.0"
description = "MCP 2026-07-28 Streamable HTTP wrapper for the Go Pet Hospital REST API."
requires-python = ">=3.11"
dependencies = [
  "mcp==2.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.12.0",
  "uvicorn>=0.31.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
pet-hospital-mcp = "pet_hospital_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
